name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # tests/run.sh skips `claude plugin validate` when the CLI is absent, so install it
      # to keep the manifest check in CI. Validation is local and needs no login.
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash tests/run.sh
        shell: bash
      - name: Verify generated Codex distribution
        run: node scripts/build-codex-plugin.js --check
      - name: Validate Codex package links and hook wiring
        run: node scripts/check-codex-package.js plugins/drillspark-harness-codex
      - name: Test Codex guards, packaging and configuration integration
        run: node --test tests/codex-guard.test.js tests/codex-package.test.js tests/codex-config.test.js
